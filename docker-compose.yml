services:
  hexgh:
    build: .
    ports:
      # VPS host : container port
      - "${HOST_PORT:-4001}:4000"
    volumes:
      - hexgh_data:/app/data
    env_file:
      - .env
    environment:
      - PORT=4000
    networks:
      - crm_backend
      - hexgh_monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: hexgh_prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - hexgh_promdata:/prometheus
    networks:
      - hexgh_monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: hexgh_grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin_hexgh}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://hexgh.nlex.uk/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - hexgh_grafanadata:/var/lib/grafana
    networks:
      - hexgh_monitoring
    restart: unless-stopped

volumes:
  hexgh_data:
  hexgh_promdata:
  hexgh_grafanadata:

networks:
  crm_backend:
    external: true
  hexgh_monitoring:
    driver: bridge
